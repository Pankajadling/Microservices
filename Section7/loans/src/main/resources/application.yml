server:
  port: 8090   # ✅ Loans service will run on port 8090

spring:
  application:
    name: loans   # ✅ Application name

  profiles:
    active: default  # ⚠️ Currently set to 'default'. For production, configure a real DB (MySQL/Postgres).
    # Keep H2 only for dev/testing.

  datasource:
    url: jdbc:mysql://localhost:3306/loansdb   # ✅ MySQL DB connection URL
    username: root                             # ✅ MySQL username
    password: root                             # ✅ MySQL password

  jpa:
    show-sql: true   # ✅ Show SQL queries in logs (useful for debugging)
  sql:
    init:
      mode: always   # ✅ Always initialize schema/data

  config:
    import: optional:configserver:http://localhost:8071/   # ✅ Import configs from Config Server

management:
  endpoints:
    web:
      exposure:
        include: "*"   # ⚠️ Exposes all actuator endpoints (restrict in prod)

