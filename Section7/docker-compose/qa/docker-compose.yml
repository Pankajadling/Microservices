services:
  allmicroservicedb:
    container_name: mysqldb
    ports:
      - "3307:3306"     # Use another port instead of default port
    volumes:
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    extends:
      file: common-config.yml
      service: microservice-db-config

  configserver:
    image: "pankajadling1193/configserver:s7"
    container_name: configserver-ms
    ports:
      - "8071:8071"
    healthcheck:
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-base-config

  accounts:
    image: "pankajadling1193/accounts:s7"
    container_name: accounts-ms
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: "accounts"
      SPRING_DATASOURCE_URL: "jdbc:mysql://allmicroservicedb:3306/accountsdb"
    depends_on:
      allmicroservicedb:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-configserver-config

  loans:
    image: "pankajadling1193/loans:s7"
    container_name: loans-ms
    ports:
      - "8090:8090"
    environment:
      SPRING_APPLICATION_NAME: "loans"
      SPRING_DATASOURCE_URL: "jdbc:mysql://allmicroservicedb:3306/loansdb"
    depends_on:
      allmicroservicedb:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-configserver-config

  cards:
    image: "pankajadling1193/cards:s7"
    container_name: cards-ms
    ports:
      - "9000:9000"
    environment:
      SPRING_APPLICATION_NAME: "cards"
      SPRING_DATASOURCE_URL: "jdbc:mysql://allmicroservicedb:3306/cardsdb"
    depends_on:
      allmicroservicedb:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-configserver-config

networks:
  eazybank:
    driver: "bridge"
